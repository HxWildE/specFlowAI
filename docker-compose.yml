services:
  # =========================================================================
  # PostgreSQL 16 with pgvector Extension
  # Single unified database for relational tables + 768-dim embeddings
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: specflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-specflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-specflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-specflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-specflow} -d ${POSTGRES_DB:-specflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
